# BeEF Configuration file

beef:
    version: '0.6.0.0'
    # More verbose messages (server-side)
    debug: false
    # More verbose messages (client-side)
    client_debug: false
    # Used for generating secure tokens
    crypto_default_value_length: 80

    # Credentials to authenticate in BeEF.
    credentials:
        user: "admin"
        passwd: "password123"

    # Interface / IP restrictions
    restrictions:
        permitted_hooking_subnet: ["0.0.0.0/0", "::/0"]
        permitted_ui_subnet: ["0.0.0.0/0", "::/0"]
        excluded_hooking_subnet: []
        api_attempt_delay: "0.05"

    # HTTP server 
    http:
        debug: false
        host: "0.0.0.0"
        port: "3000"

        xhr_poll_timeout: 1000

        # Public Domain Name / Reverse Proxy / Port Forwarding
        public:
            host: "beef-production-df62.up.railway.app"
            port: "443"
            https: true

        allow_reverse_proxy: true

        # Hook
        hook_file: "/hook.js"
        hook_session_name: "BEEFHOOK"

        restful_api:
            allow_cors: false
            cors_allowed_domains: "http://browserhacker.com"

        websocket:
            enable: false
            port: 61985
            secure: true
            secure_port: 61986
            ws_poll_timeout: 5000
            ws_connect_timeout: 500

        web_server_imitation:
            enable: true
            type: "apache"
            hook_404: false
            hook_root: false

        https:
            enable: false
            key: "beef_key.pem"
            cert: "beef_cert.pem"

    database:
        file: "beef.db"

    dns_hostname_lookup: false

    geoip:
        enable: true
        database: '/usr/share/GeoIP/GeoLite2-City.mmdb'

    extension:
        admin_ui:
            enable: true
            base_path: "/panel"
        demos:
            enable: true
        events:
            enable: true
        evasion:
            enable: false
        requester:
            enable: true
        proxy:
            enable: true
        network:
            enable: true
        metasploit:
            enable: false
        social_engineering:
            enable: false
        xssrays:
            enable: true
